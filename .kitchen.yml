          "worker9.cluster.gitlab.com": "127.0.0.1",
          "worker10.cluster.gitlab.com": "127.0.0.1",
          "worker11.cluster.gitlab.com": "127.0.0.1",
          "worker12.cluster.gitlab.com": "127.0.0.1",
