---
driver:
  name: vagrant

provisioner:
  name: chef_zero
  data_bags_path: test/integration/data_bags
platforms:
  - name: ubuntu-16.04

suites:
  - name: haproxy-frontend
    run_list:
      - recipe[gitlab-haproxy::frontend]
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        frontend:
          api:
            servers:
              api01.stg.gitlab.com: 127.0.0.1
          https_git:
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          registry:
            servers:
              registry01.be.gitlab.com: 127.0.0.1
          ssh:
            port: 2222
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          web:
            servers:
              web01.stg.gitlab.com: 127.0.0.1
          websockets:
            servers:
              web01.stg.gitlab.com: 127.0.0.1


  - name: haproxy-backend
    run_list:
      - recipe[gitlab-haproxy::backend]
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        backend:
          rails:
            servers:
              rails01.be.gitlab.com: 127.0.0.1

  - name: haproxy-pages
    run_list:
      - recipe[gitlab-haproxy::pages]
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        pages:
          servers:
            web01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-altssh
    run_list:
      - recipe[gitlab-haproxy::altssh]
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        altssh:
          servers:
            ssh01.stg.gitlab.com: 127.0.0.1
