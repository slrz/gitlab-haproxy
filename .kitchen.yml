        socket_servers: {
          "worker1.cluster.gitlab.com": "127.0.0.1",
          "worker2.cluster.gitlab.com": "127.0.0.1"
        },
        pinned_servers: {
          "worker1.cluster.gitlab.com": "127.0.0.1",
          "worker2.cluster.gitlab.com": "127.0.0.1"
        }}
