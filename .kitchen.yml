---
driver:
  name: docker

provisioner:
  name: chef_solo

platforms:
  - name: ubuntu-16.04
  - name: ubuntu-14.04

suites:
  - name: haproxy-gitlab
    run_list:
      - recipe[gitlab-haproxy::gitlab]
    attributes:
      gitlab-haproxy: {
        servers: {
          "worker1.cluster.gitlab.com": "127.0.0.1",
          "worker2.cluster.gitlab.com": "127.0.0.1",
          "worker3.cluster.gitlab.com": "127.0.0.1",
