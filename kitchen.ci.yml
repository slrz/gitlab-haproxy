---

driver:
  name: gce
  project: gitlab-test-kitchen
  region: us-east1
  labels:
    - gitlab-haproxy
  tags:
    - test-kitchen
  metadata:
    ssh-keys: <%= 'testkitchen:' + IO.binread("#{ENV['SSH_KEY']}.pub").rstrip! %>

provisioner:
  production_name: chef
  product_version: 14.12.3
  data_bags_path: test/integration/data_bags
  require_chef_omnibus: '14'

platforms:
  - name: ubuntu-16-04-x64
    driver:
      image_project: ubuntu-os-cloud
      image_family: ubuntu-1604-lts
      image_name: ubuntu-1604-xenial-v20210928
      metadata:
        application: ubuntu
        release: a
        version: 1604
  - name: ubuntu-18-04-x64
    driver:
      image_project: ubuntu-os-cloud
      image_family: ubuntu-1804-lts
      metadata:
        application: ubuntu
        release: a
        version: 1804

# On CI, the ephemeral ed25519 key is generated by default
transport:
  connection_retries: 60
  connection_retry_sleep: 10
  username: testkitchen
  ssh_key: ~/.ssh/id_ed25519

verifier:
  name: inspec

# `make kitchen` will parse the number of suites and fire up corresponding number of threads
suites:
  - name: haproxy-frontend
    excludes:
      - ubuntu-16-04-x64
    run_list:
      - recipe[gitlab-haproxy::frontend]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/frontend
    attributes:
      gitlab-haproxy:
        api_address: 0.0.0.0  # for integration tests
        chef_vault: secrets
        chef_vault_item: certs
        drain_time_seconds: 4
        frontend:
          api:
            servers:
              api01.stg.gitlab.com: 127.0.0.1
          https:
            enable_ratelimit_bypass_header: true
            enable_jwt_auth_ratelimit_bypass: true
            enable_package_registry_ratelimit_bypass: true
            enable_go_get_ratelimit_bypass: true
          https_git:
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          registry:
            servers:
              registry01.be.gitlab.com: 127.0.0.1
          ssh:
            port: 2222
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          web:
            servers:
              web01.stg.gitlab.com: 127.0.0.1
          websockets:
            servers:
              web01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-frontend-cloudflare
    excludes:
      - ubuntu-16-04-x64
    run_list:
      - recipe[gitlab-haproxy::frontend]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/frontend
        - test/integration/cloudflare
    attributes:
      gitlab-haproxy:
        api_address: 0.0.0.0  # for integration tests
        chef_vault: secrets
        chef_vault_item: certs
        cloudflare:
          enable: true
        drain_time_seconds: 4
        frontend:
          api_rate_limit:
            enforced: false
          api:
            servers:
              api01.stg.gitlab.com: 127.0.0.1
          enforce_cloudflare_origin_pull: true
          https_git:
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          registry:
            servers:
              registry01.be.gitlab.com: 127.0.0.1
          ssh:
            port: 2222
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          web:
            servers:
              web01.stg.gitlab.com: 127.0.0.1
          websockets:
            servers:
              web01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-pages
    run_list:
      - recipe[gitlab-haproxy::pages]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/pages
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        drain_time_seconds: 4
        pages:
          servers:
            web01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-altssh
    excludes:
      - ubuntu-16-04-x64
    run_list:
      - recipe[gitlab-haproxy::altssh]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/altssh
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        drain_time_seconds: 4
        altssh:
          backend:
            servers:
              default:
                altssh:
                  ssh01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-registry
    excludes:
      - ubuntu-16-04-x64
    run_list:
      - recipe[gitlab-haproxy::registry]
    verifier:
      inspec_tests:
        - test/integration/default
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        drain_time_seconds: 4
        registry:
          servers:
            registry01.be.gitlab.com: 127.0.0.1

  - name: haproxy-camoproxy
    excludes:
      - ubuntu-16-04-x64
    run_list:
      - recipe[gitlab-haproxy::camoproxy]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/camoproxy
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        drain_time_seconds: 4
