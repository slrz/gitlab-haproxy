---
driver:
  name: docker 

provisioner:
  name: chef_zero
  data_bags_path: "test/integration/data_bags"
  require_chef_omnibus: "14"

platforms:
  - name: ubuntu-16-04-x64
    driver_config:
      image: ubuntu:16.04 
      run_command: /lib/systemd/systemd --system
      privileged: true
  - name: ubuntu-18-04-x64
    driver_config:
      image: ubuntu:18.04 
      run_command: /lib/systemd/systemd --system
      privileged: true

verifier:
  name: inspec

transport:
  ssh_key: <%= ENV['GITLAB_DO_SSH_KEY'] || "~/.ssh/id_rsa" %>
  username: root

suites:
  - name: haproxy-frontend
    run_list:
      - recipe[gitlab-haproxy::frontend]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/frontend
    attributes:
      gitlab-haproxy:
        api_address: 0.0.0.0  # for integration tests
        chef_vault: secrets
        chef_vault_item: certs
        frontend:
          api:
            servers:
              api01.stg.gitlab.com: 127.0.0.1
          https_git:
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          registry:
            servers:
              registry01.be.gitlab.com: 127.0.0.1
          ssh:
            port: 2222
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          web:
            servers:
              web01.stg.gitlab.com: 127.0.0.1
          websockets:
            servers:
              web01.stg.gitlab.com: 127.0.0.1
    lifecycle:
      pre_converge:
        remote: "sudo apt-get update; sudo apt-get -y install iproute2 gnupg rsyslog git"
      post_converge:
        remote: "sudo systemctl start haproxy"


  - name: haproxy-frontend-cloudflare
    run_list:
      - recipe[gitlab-haproxy::frontend]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/frontend
        - test/integration/cloudflare
    attributes:
      gitlab-haproxy:
        api_address: 0.0.0.0  # for integration tests
        chef_vault: secrets
        chef_vault_item: certs
        cloudflare:
          enable: true
        frontend:
          api_rate_limit:
            enforced: false
          api:
            servers:
              api01.stg.gitlab.com: 127.0.0.1
          enforce_cloudflare_origin_pull: true
          https_git:
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          registry:
            servers:
              registry01.be.gitlab.com: 127.0.0.1
          ssh:
            port: 2222
            servers:
              git01.stg.gitlab.com: 127.0.0.1
          web:
            servers:
              web01.stg.gitlab.com: 127.0.0.1
          websockets:
            servers:
              web01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-pages
    run_list:
      - recipe[gitlab-haproxy::pages]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/pages
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        pages:
          servers:
            web01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-ci
    excludes:
      - ubuntu-16-04-x64 # 16.04 doesn't support haproxy-2.1
    run_list:
      - recipe[gitlab-haproxy::ci]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/ci
        - test/integration/ci_no_fallback
    attributes:
      gitlab-haproxy:
        timeout_server: 1h #copied from gprd

        chef_vault: secrets
        chef_vault_item: certs
        frontend:
          blacklist:
            uri:
              "/blacklist/test": "Testing"
        ci:
          backend:
            servers:
              default:
                api:
                  api01.gitlab.com: 127.0.0.1
                https_git:
                  git01.gitlab.com: 127.0.0.1
                canary_api:
                  canary.api01.gitlab.com: 127.0.0.1
                canary_https_git:
                  canary.git01.gitlab.com: 127.0.0.1

  - name: haproxy-ci-fallback
    excludes:
      - ubuntu-16-04-x64 # 16.04 doesn't support haproxy-2.1
    run_list:
      - recipe[gitlab-haproxy::ci]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/ci
        - test/integration/ci_fallback
    attributes:
      gitlab-haproxy:
        timeout_server: 1h #copied from gprd

        chef_vault: secrets
        chef_vault_item: certs
        frontend:
          blacklist:
            uri:
              "/blacklist/test": "Testing"
        ci:
          enable_fallback: true
          backend:
            servers:
              default:
                api:
                  api01.gitlab.com: 127.0.0.1
                https_git:
                  git01.gitlab.com: 127.0.0.1
                canary_api:
                  canary.api01.gitlab.com: 127.0.0.1
                canary_https_git:
                  canary.git01.gitlab.com: 127.0.0.1

  - name: haproxy-altssh
    run_list:
      - recipe[gitlab-haproxy::altssh]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/altssh
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        altssh:
          backend:
            servers:
              default:
                altssh:
                  ssh01.stg.gitlab.com: 127.0.0.1

  - name: haproxy-registry
    run_list:
      - recipe[gitlab-haproxy::registry]
    verifier:
      inspec_tests:
        - test/integration/default
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
        registry:
          servers:
            registry01.be.gitlab.com: 127.0.0.1

  - name: haproxy-camoproxy
    run_list:
      - recipe[gitlab-haproxy::camoproxy]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/camoproxy
    attributes:
      gitlab-haproxy:
        chef_vault: secrets
        chef_vault_item: certs
