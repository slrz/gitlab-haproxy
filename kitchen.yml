---

driver:
  name: gce
  project: gitlab-test-kitchen
  zone: us-east1-b # For improved reproducibility of the config
  labels:
    - gitlab-haproxy
  tags:
    - test-kitchen
  metadata:
    ssh-keys: <%= 'testkitchen:' + IO.binread("#{ENV['SSH_KEY']}.pub").rstrip! %>

provisioner:
  name: chef_zero
  product_name: chef
  product_version: 14.15.6
  data_bags_path: test/integration/data_bags
#  require_chef_omnibus: '14'
  always_update_cookbooks: false # Override the default for kitchen 2.0+, otherwise new upstream cookbooks will be pulled in that might require chef > 14

platforms:
  - name: ubuntu-20-04-x64
    driver:
      image_project: ubuntu-os-cloud
      image_family: ubuntu-2004-lts
      metadata:
        application: ubuntu
        release: a
        version: 2004

# On CI, the ephemeral ed25519 key is generated by default
transport:
  name: speedy_ssh
  connection_retries: 60
  connection_retry_sleep: 10
  username: testkitchen
  ssh_key: ~/.ssh/id_ed25519

verifier:
  name: inspec
  load_plugins: true
  reporter:
    - cli
    - junit:.kitchen/%{suite}-%{platform}_inspec.xml

# `make kitchen` will parse the number of suites and fire up corresponding number of threads
suites:
  - name: haproxy-main
    run_list:
      - recipe[gitlab-haproxy::frontend]
    verifier:
      inspec_tests:
        - test/integration/default
        - test/integration/main
    attributes:
      gitlab-haproxy:
        api_address: 0.0.0.0  # for integration tests
        chef_vault: secrets
        chef_vault_item: certs
#### START REGRESSION CONFIG Copied from fe-01-lb-gprd on 2022-11-30
        major-version:                haproxy-1.8 # This is ignored for 2.6
        systemd_service_overrides:
          enable: true
        drain_time_seconds: 600
        systemd_timeout_stop_seconds: 750
        secrets: # not set for kitchen
        errors:
          '503':
            title: An internal server error occured.
            subtitle: Please see our <a href="https://status.gitlab.com">status page</a> for more information.
        global:
          extra-default-bind-ciphers: ''
          ssl-default-bind-ciphers: "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:ECDHE-RSA-DES-CBC3-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4:!3DES"
          ssl-default-bind-options: no-tlsv10 no-tlsv11
          nbthread: 8
          hard-stop:
            enable: true
            timeout: 20m
        delay_speed_ms: '1000'
        timeout_connect: '5000'
        timeout_check: '30000'
        timeout_server_ssh: 2h
        timeout_server_camoproxy: 10s
        timeout_client_fin: 5s
        timeout_server_fin: 5s
        timeout_tunnel: 8s
        listen_address: 0.0.0.0
        timeout_client: 90s
        timeout_server: 1h
        maxconn: '20000'
        frontend:
          blacklist:
            uri:
              # Redacted
              /test: this is a comment
          whitelist:
            api:
              104.196.221.206:          shared-runners-manager-4
              104.196.48.2:             shared-runners-manager-3
              # Customer data removed
            internal:
              10.221.2.0/23:   Gitaly File Subnet Prod#6641
              # Other IPs removed
          peers:
            servers:
              fe-01-lb-gprd:
                - example.com # HAProxy must be able to resolve the address, so we cannot use the internal DNS names here
                - 32768
              fe-02-lb-gprd:
                - example.com
                - 32768
              kitchen-vm-under-test: # Used for kitchen tests
                - example.com
                - 32768
          api:
            httpchk_host: gitlab.com
            httpchk_path: "/-/k8s/api/-/readiness"
            servers: {}
            rate_limit_http_rate_per_minute: '2000'
            rate_limit_package_registry_rate_per_minute: '7000'
            check_opts: check-ssl
            tcp_check_enable: false
            server_port: '443'
            ssl_verify: ssl verify none
            default_weight: '100'
          https_git:
            httpchk_host: gitlab.com
            httpchk_path: "/-/readiness"
            check_opts: port 8181
            tcp_check_enable: false
            servers: {}
            server_port: '8181'
            ssl_verify: ''
            use_verbose_acls: false
            default_weight: '100'
          canary_https_git:
            httpchk_host: gitlab.com
            httpchk_path: "/-/readiness"
            check_opts: port 8181
            tcp_check_enable: true
            server_port: '8181'
            ssl_verify: ''
            enable: true
            default_weight: '5'
            servers: {}
          https:
            custom_config:
              - "# Overridden to test injection #####"
              - "# override for https frontend"
              - "####################################"
            rate_limit_frontend_port: '4444'
            rate_limit_sessions_per_second: '10'
            rate_limit_whitelist: 1.2.3.4 5.6.7.8
            api_ratelimit_bypass_for_useragent:
              enable: false
              useragent:
            extra_bind_port: 11443
            enable_ratelimit_bypass_header: true
            enable_jwt_auth_ratelimit_bypass: true
            enable_package_registry_ratelimit_bypass: true
            enable_go_get_ratelimit_bypass: true
          kas:
            bind_options: ssl crt /etc/haproxy/ssl/kas.pem npn spdy/3.1,http/1.1
            check_opts: port 8151
            timeout_http_request: 10s
            custom_config:
              - "# Overridden to test injection #####"
              - "# override for kas frontend"
              - "####################################"
            default_weight: '100'
            httpchk_host: kas.gitlab.com
            httpchk_path: "/liveness"
            port: '8150'
            proxy_endpoint: "/k8s-proxy"
            proxy_port: '8154'
            server_port: '8150'
            servers: {}
            tcp_check_enable: false
          canary_kas:
            default_weight: '5'
            servers: {}
          ssh:
            httpchk_host: gitlab.com
            httpchk_path: "/-/health"
            check_opts: ''
            tcp_check_enable: true
            # port: '22'
            port: '2222' # ONLY IN KITCHEN! This is because on 'real' HAProxy nodes, SSH binds on port 2222, but in kitchen it binds on 22, so we need to swap
            server_port: '2222'
            ssl_verify: ssl verify none
            servers: {}
            custom_config:
              - "# Overridden to test injection #####"
              - "# override for ssh frontend"
              - "####################################"
            default_weight: '100'
            send-proxy-v2: true
            balance: roundrobin
          canary_ssh:
            send-proxy-v2: true
            default_weight: '5'
            servers: {}
          altssh:
            send-proxy-v2: false
            default_weight: '100'
          canary_altssh:
            send-proxy-v2: false
            default_weight: '0'
          web:
            httpchk_host: gitlab.com
            httpchk_path: "/-/readiness"
            check_opts: port 8181
            tcp_check_enable: false
            content_security_policy_enabled: false
            content_security_policy: " default-src 'self';"
            content_security_policy_report_only_enabled: false
            content_security_policy_report_only: " default-src 'self';"
            access_control_allow_headers:
              enable: false
              headers: " X-Requested-With"
            server_port: '8181'
            ssl_verify: ''
            servers: {}
            default_weight: '100'
          web_k8s:
            servers: {}
            check_opts: port 8181
            server_port: '8181'
            ssl_verify: ''
            default_weight: '0'
          canary_web:
            httpchk_host: gitlab.com
            httpchk_path: "/-/readiness"
            check_opts: port 8181
            tcp_check_enable: false
            server_port: '8181'
            ssl_verify: ''
            content_security_policy_enabled: false
            content_security_policy: " default-src 'self';"
            content_security_policy_report_only_enabled: false
            content_security_policy_report_only: " default-src 'self';"
            enable: true
            default_weight: '3'
            servers: {}
          websockets:
            servers: {}
            check_opts: port 8181
            tcp_check_enable: false
            httpchk_host: gitlab.com
            httpchk_path: "/-/readiness"
            server_port: '8181'
            ssl_verify: ''
            default_weight: '100'
          api_rate_limit:
            custom_config: []
            enforced: true
            package_registry_enforced: true
          default_check_opts: inter 3s fastinter 1s downinter 5s fall 3
          asset_proxy:
            enable: true
            httpchk_path: "/info"
            host: gitlab-gprd-assets.storage.googleapis.com
            server: storage.googleapis.com
            opts: check check-ssl inter 2s fastinter 1s downinter 5s fall 3 ssl verify none
            server_port: '443'
          canary_api:
            enable: true
            default_weight: '5'
            servers: {}
          canary_registry:
            enable: true
          canary_websockets:
            default_weight: '5'
            servers: {}
          canary_request_path:
            path_list:
              - "/charts"
              - "/groups/gitlab-com"
              - "/groups/gitlab-org"
              - "/groups/gitlab-data"
              - "/groups/meltano"
              - "/gitlab-com"
              - "/gitlab-org"
              - "/gitlab-org/www-gitlab-com"
              - "/gitlab-data"
              - "/meltano"
              - "/api/v4/groups/gitlab-com"
              - "/api/v4/groups/gitlab-org"
              - "/api/v4/projects/gitlab-com"
              - "/api/v4/projects/gitlab-org"
          root_page_redirect:
            enable: false
            url: https://about.gitlab.com
            session_cookie: _gitlab_session
            status_code: '301'
          enforce_cloudflare_origin_pull: true
          backend:
            servers:
              default:
                api: {}
                https_git: {}
                kas:
                  kas-gke: 10.216.8.102
                canary_kas:
                  gke-cny-web: 10.216.8.85
                ssh: {}
                web: {}
                web_k8s: {}
                websockets: {}
                canary_web:
                  gke-cny-web: 10.216.8.87
                canary_websockets:
                  gke-cny-ws: 10.216.8.15
                canary_api:
                  gke-cny-api: 10.216.8.44
                canary_ssh:
                  gke-cny-ssh: 10.216.8.61
                canary_https_git:
                  gke-cny-git-https: 10.216.8.10
              us-east1-b:
                api:
                  api-gke-us-east1-b: 10.221.13.25
                web:
                  web-gke-us-east1-b: 10.221.13.65
                ssh:
                  shell-gke-us-east1-b: 10.221.13.40
                websockets:
                  ws-gke-us-east1-b: 10.221.13.19
                https_git:
                  git-https-gke-us-east1-b: 10.221.13.9
              us-east1-c:
                api:
                  api-gke-us-east1-c: 10.221.14.23
                web:
                  web-gke-us-east1-c: 10.221.14.55
                ssh:
                  shell-gke-us-east1-c: 10.221.14.5
                websockets:
                  ws-gke-us-east1-c: 10.221.14.26
                https_git:
                  git-https-gke-us-east1-c: 10.221.14.17
              us-east1-d:
                api:
                  api-gke-us-east1-d: 10.221.15.31
                web:
                  web-gke-us-east1-d: 10.221.15.66
                ssh:
                  shell-gke-us-east1-d: 10.221.15.5
                websockets:
                  ws-gke-us-east1-d: 10.221.15.37
                https_git:
                  git-https-gke-us-east1-d: 10.221.15.3
            essential:
              - api
              - https_git
              - ssh
              - web
              - websockets
          canonical_host: gitlab.com
          delay_speed_ms: '30000'
        kas:
          enable: true
          timeout_tunnel: 2h
          timeout_server: 1h
        altssh:
          backend:
            essential:
              - altssh
            servers:
              default:
                altssh: {}
          custom_config:
        canary_altssh:
          backend:
            essential: []
            servers:
              default:
                canary_altssh: {}
        pages:
          default_weight: '100'
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          http_custom_config:
          https_custom_config:
          servers: {}
          peers:
            servers: {}
          http_backend_listen_port: 1080
          https_backend_listen_port: 1443
          https_proxyv2_backend_listen_port: 2443
          enable_https_proxyv2: false
          enable_domain_blacklisting: false
          enable_domain_rate_limiting: false
          domain_rate_limit_per_second: '800'
          backend:
            servers:
              default:
                pages: {}
                canary_pages: {}
            essential:
              - pages
        canary_pages:
          default_weight: '0'
          http_backend_listen_port: 1080
          https_backend_listen_port: 1443
          https_proxyv2_backend_listen_port: 2443
        registry:
          servers: {}
          peers:
            servers: {}
          custom_config:
          backend_port: '5000'
          ssl_verify:
          httpchk_host: registry.gitlab.com
          httpchk_path: "/debug/health"
          tcp_check_enable: false
          default_check_opts: inter 2s fastinter 1s downinter 5s fall 3 port 5001
          default_weight: '100'
          enforce_cloudflare_origin_pull: false
