            essential:
              - registry
        canary_registry:
          servers: {}
          default_weight: '0'
        camoproxy:
          server_port: 8080
          httpchk_path: "/status"
        cloudflare:
          enable: true
          ignore-proxy: false
        close_client_connections: true
        ci-gateway:
          enabled: true
          listen_port: 8989
          allowlisted_runner_managers:
            - 10.0.0.0/8
          redirect_all_traffic_externally: false
          redirect_using_lua: false
          _comment: We enable ci-gateway on this cluster so we can monitor the certificate of ci-gateway through int.gprd.gitlab.net ILB

