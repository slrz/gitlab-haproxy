- name: haproxy-state-persistence
  run_list:
  - recipe[gitlab-haproxy::kitchen_update_ca_certs]
  - recipe[gitlab-haproxy::main]
  verifier:
    inspec_tests:
    - test/integration/state_persistence
  attributes:
    gitlab-haproxy:
      server_state_persistence:
        enable: true
      listen_addresses:
      - 0.0.0.0
      - "::"
      api_address: 0.0.0.0
      chef_vault: secrets
      chef_vault_item: certs
      errors:
        '503':
          title: An internal server error occured.
          subtitle: Please see our <a href="https://status.gitlab.com">status page</a>
            for more information.
      maxconn: '20000'
      frontend:
        blocklist:
          uri:
            "/test": this is a comment
        peers:
          servers:
            haproxy-main-01-lb-gprd:
            - 34.74.226.1.nip.io
            - 32768
            haproxy-main-02-lb-gprd:
            - 34.74.226.1.nip.io
            - 32768
            kitchen-vm-under-test:
            - 34.74.226.1.nip.io
            - 32768
        api:
          httpchk_host: gitlab.com
          httpchk_path: "/-/k8s/api/-/readiness"
          check_opts: check-ssl
          tcp_check_enable: false
          server_port: '443'
          ssl_verify: ssl verify none
          default_weight: '100'
        https_git:
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          check_opts: port 8181
          tcp_check_enable: false
          server_port: '8181'
          ssl_verify: ''
          use_verbose_acls: false
          default_weight: '100'
        canary_https_git:
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          check_opts: port 8181
          tcp_check_enable: true
          server_port: '8181'
          ssl_verify: ''
          enable: true
          default_weight: '5'
        https:
          custom_config:
          - "# Overridden to test injection #####"
          - "# override for https frontend"
          - "####################################"
