---
driver:
  name: gce
  project: gitlab-test-kitchen
  zone: us-east1-b
  labels:
  - gitlab-haproxy
  tags:
  - test-kitchen
  metadata:
    ssh-keys: <%= 'testkitchen:' + IO.binread("#{ENV['SSH_KEY']}.pub").rstrip! %>
provisioner:
  name: chef_zero
  product_name: chef
  product_version: "<%= ENV['GITLAB_KITCHEN_CHEF_VERSION'] || '14.15.6' %>"
  data_bags_path: test/integration/data_bags
  nodes_path: test/integration/nodes
  always_update_cookbooks: false
platforms:
- name: ubuntu-22-04-x64-cinc
  driver:
    image_project: ubuntu-os-cloud
    image_family: ubuntu-2204-lts
    metadata:
      application: ubuntu
      release: a
      version: 2204
  provisioner:
    name: chef_zero
    product_name: cinc
    download_url: https://packages.cinc.sh/files/stable/cinc/16.18.30/ubuntu/22.04/cinc_16.18.30-1_amd64.deb
    product_version: 16.18.30
    client_rb:
      ohai.optional_plugins:
      - :Passwd
  lifecycle:
    pre_converge:
    - remote: timeout 5m cloud-init status --wait
    - remote: sudo apt-get update
    - remote: sudo rm /etc/apt/apt.conf.d/99needrestart # https://serverfault.com/q/1101391
    - remote: sudo apt-get install -y build-essential
transport:
  name: speedy_ssh
  connection_retries: 60
  connection_retry_sleep: 10
  username: testkitchen
  ssh_key: "<%= ENV['SSH_KEY'] || '~/.ssh/id_ed25519' %>"
verifier:
  name: inspec
  load_plugins: true
  reporter:
  - cli
  - junit:.kitchen/%{suite}-%{platform}_inspec.xml
suites:
- name: haproxy-main
  run_list:
  - recipe[gitlab-haproxy::kitchen_update_ca_certs]
  - recipe[gitlab-haproxy::main]
  verifier:
    inspec_tests:
    - test/integration/default
    - test/integration/main
  attributes:
    gitlab-haproxy:
      agent:
        enable: true
        use_deploy_token: false
        download_url_base: https://gitlab.com/api/v4/projects/gitlab-com%2Fgl-infra%2Fgitlab-haproxy-agent/packages/generic/gitlab-haproxy-agent
        # The gitlab.com artifact differs byte-wise from the ops one.
        checksum: d3de9447a3cb4b0a2e8b2c897a4922793ebb65f6f91ee3bfaad7401016f8f7b2
        check_backends:
        - canary_web
      listen_addresses:
      - 0.0.0.0
      - "::"
      api_address: 0.0.0.0
      chef_vault: secrets
      chef_vault_item: certs
      errors:
        '503':
          title: An internal server error occured.
          subtitle: Please see our <a href="https://status.gitlab.com">status page</a>
            for more information.
      maxconn: '20000'
      frontend:
        blocklist:
          uri:
            "/test": this is a comment
        peers:
          servers:
            haproxy-main-01-lb-gprd:
            - 34.74.226.1.nip.io
            - 32768
            haproxy-main-02-lb-gprd:
            - 34.74.226.1.nip.io
            - 32768
            kitchen-vm-under-test:
            - 34.74.226.1.nip.io
            - 32768
        api:
          httpchk_host: gitlab.com
          httpchk_path: "/-/k8s/api/-/readiness"
          check_opts: check-ssl
          tcp_check_enable: false
          server_port: '443'
          ssl_verify: ssl verify none
          default_weight: '100'
        https_git:
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          check_opts: port 8181
          tcp_check_enable: false
          server_port: '8181'
          ssl_verify: ''
          use_verbose_acls: false
          default_weight: '100'
        canary_https_git:
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          check_opts: port 8181
          tcp_check_enable: true
          server_port: '8181'
          ssl_verify: ''
          enable: true
          default_weight: '5'
        https:
          custom_config:
          - "# Overridden to test injection #####"
          - "# override for https frontend"
          - "####################################"
          extra_bind_port: 11443
        kas:
          check_opts: port 8151
          custom_config:
          - "# Overridden to test injection #####"
          - "# override for kas frontend"
          - "####################################"
          default_weight: '100'
          httpchk_host: kas.gitlab.com
          httpchk_path: "/liveness"
          port: '8150'
          proxy_endpoint: "/k8s-proxy"
          proxy_port: '8154'
          server_port: '8150'
          tcp_check_enable: false
        canary_kas:
          default_weight: '5'
        ssh:
          httpchk_host: gitlab.com
          httpchk_path: "/-/health"
          check_opts: ''
          tcp_check_enable: true
          port: '2222'
          server_port: '2222'
          ssl_verify: ssl verify none
          custom_config:
          - "# Overridden to test injection #####"
          - "# override for ssh frontend"
          - "####################################"
          default_weight: '100'
          send-proxy-v2: true
          balance: roundrobin
        canary_ssh:
          send-proxy-v2: true
          default_weight: '5'
        web:
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          check_opts: port 8181
          tcp_check_enable: false
          server_port: '8181'
          ssl_verify: ''
          default_weight: '100'
        web_k8s:
          check_opts: port 8181
          server_port: '8181'
          ssl_verify: ''
          default_weight: '0'
        canary_web:
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          check_opts: port 8181
          tcp_check_enable: false
          server_port: '8181'
          ssl_verify: ''
          enable: true
          default_weight: '3'
        websockets:
          check_opts: port 8181
          tcp_check_enable: false
          httpchk_host: gitlab.com
          httpchk_path: "/-/readiness"
          server_port: '8181'
          ssl_verify: ''
          default_weight: '100'
        default_check_opts: inter 3s fastinter 1s downinter 5s fall 3
        asset_proxy:
          enable: true
          httpchk_path: "/info"
          host: gitlab-gprd-assets.storage.googleapis.com
          server: storage.googleapis.com
          opts: check check-ssl inter 2s fastinter 1s downinter 5s fall 3 ssl verify
            none
          server_port: '443'
        canary_api:
          enable: true
          default_weight: '5'
        canary_ai_assisted:
          enable: true
          default_weight: '5'
        canary_registry:
          enable: true
        canary_websockets:
          default_weight: '5'
        canary_request_path:
          path_list:
          - "/charts"
          - "/groups/gitlab-com"
          - "/groups/gitlab-org"
          - "/groups/gitlab-data"
          - "/groups/meltano"
          - "/gitlab-com"
          - "/gitlab-org"
          - "/gitlab-org/www-gitlab-com"
          - "/gitlab-data"
          - "/meltano"
          - "/api/v4/groups/gitlab-com"
          - "/api/v4/groups/gitlab-org"
          - "/api/v4/projects/gitlab-com"
          - "/api/v4/projects/gitlab-org"
        enforce_cloudflare_origin_pull: true
        backend:
          servers:
            default:
              api: {}
              https_git: {}
              kas:
                kas-gke: 10.216.8.102
              canary_kas:
                gke-cny-web: 10.216.8.85
              ssh: {}
              web: {}
              web_k8s: {}
              websockets: {}
              canary_web:
                gke-cny-web: 10.216.8.87
              canary_websockets:
                gke-cny-ws: 10.216.8.15
              canary_api:
                gke-cny-api: 10.216.8.44
              canary_ai_assisted:
                gke-cny-ai-assisted: 10.216.8.2
              canary_ssh:
                gke-cny-ssh: 10.216.8.61
              canary_https_git:
                gke-cny-git-https: 10.216.8.10
            us-east1-b:
              api:
                api-gke-us-east1-b: 10.221.13.25
              web:
                web-gke-us-east1-b: 10.221.13.65
              ssh:
                shell-gke-us-east1-b: 10.221.13.40
              websockets:
                ws-gke-us-east1-b: 10.221.13.19
              ai_assisted:
                ai-assisted-gke-us-east1-b: 10.224.44.46
              https_git:
                git-https-gke-us-east1-b: 10.221.13.9
            us-east1-c:
              api:
                api-gke-us-east1-c: 10.221.14.23
              web:
                web-gke-us-east1-c: 10.221.14.55
              ssh:
                shell-gke-us-east1-c: 10.221.14.5
              websockets:
                ws-gke-us-east1-c: 10.221.14.26
              ai_assisted:
                ai-assisted-gke-us-east1-c: 10.224.45.71
              https_git:
                git-https-gke-us-east1-c: 10.221.14.17
            us-east1-d:
              api:
                api-gke-us-east1-d: 10.221.15.31
              web:
                web-gke-us-east1-d: 10.221.15.66
              ssh:
                shell-gke-us-east1-d: 10.221.15.5
              websockets:
                ws-gke-us-east1-d: 10.221.15.37
              ai_assisted:
                ai-assisted-gke-us-east1-d: 10.224.46.21
              https_git:
                git-https-gke-us-east1-d: 10.221.15.3
          essential:
          - api
          - https_git
          - ssh
          - web
          - websockets
        canonical_host: gitlab.com
        delay_speed_ms: '30000'
        packhorse_host: 10.0.1.100
        packhorse_repos:
        - /gitlab-org/gitlab.git
      kas:
        enable: true
        timeout_tunnel: 2h
        timeout_server: 1h
      pages:
        default_weight: '100'
        httpchk_host: gitlab.com
        httpchk_path: "/-/readiness"
        http_custom_config: 
        https_custom_config: 
        peers: 
        http_backend_listen_port: 1080
        https_backend_listen_port: 1443
        https_proxyv2_backend_listen_port: 2443
        enable_https_proxyv2: false
        enable_domain_rate_limiting: false
        domain_rate_limit_per_second: '800'
        backend:
          servers:
            default:
              pages: {}
              canary_pages: {}
          essential:
          - pages
      canary_pages:
        default_weight: '0'
        http_backend_listen_port: 1080
        https_backend_listen_port: 1443
        https_proxyv2_backend_listen_port: 2443
      registry:
        peers: 
        custom_config: 
        backend_port: '5000'
        ssl_verify: 
        httpchk_host: registry.gitlab.com
        httpchk_path: "/debug/health"
        tcp_check_enable: false
        default_check_opts: inter 2s fastinter 1s downinter 5s fall 3 port 5001
        default_weight: '100'
        enforce_cloudflare_origin_pull: false
        backend:
          servers:
            default:
              registry: {}
              canary_registry: {}
          essential:
          - registry
      canary_registry:
        default_weight: '0'
      ci-gateway:
        enabled: true
        listen_port: 8989
        allowlisted_runner_managers:
        - 10.0.0.0/8
        packhorse_host: 10.0.1.100
        packhorse_repos:
        - /gitlab-org/gitlab.git
        _comment: We enable ci-gateway on this cluster so we can monitor the certificate
          of ci-gateway through int.gprd.gitlab.net ILB
  lifecycle:
    pre_converge:
    - remote: timeout 20 /bin/bash -c 'while [[ ! $(grep cloud-init /etc/apt/sources.list)
