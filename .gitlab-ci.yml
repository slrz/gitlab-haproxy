image: ruby:3.3

stages:
  - prepare
  - lint
  - unit
  - integration
  - publish

include:
  - project: gitlab-com/gl-infra/common-ci-tasks
    file: templates/chef.yml
    ref: main

kitchen:
  stage: integration
  retry: 2
  artifacts:
    expire_in: '2d'
    when: always
    paths:
      - .kitchen/
    reports:
      junit: .kitchen/*_inspec.xml
  cache:
    paths:
      - $BUNDLE_PATH
  script:
    - !reference [.kitchen_prepare, script]
    - SSH_KEY="$HOME/.ssh/id_ed25519" bundle exec kitchen test --destroy=always $KITCHEN_SUITE
  parallel:
    matrix:
      - KITCHEN_SUITE:
        # generate with: make update-ci
        # SUITES_BEGIN
        - haproxy-main-ubuntu-20-04-x64
        - haproxy-main-ubuntu-20-04-x64-cinc
        - haproxy-main-ubuntu-22-04-x64-cinc
        - haproxy-pages-ubuntu-20-04-x64
        - haproxy-pages-ubuntu-20-04-x64-cinc
        - haproxy-pages-ubuntu-22-04-x64-cinc
        - haproxy-registry-ubuntu-20-04-x64
        - haproxy-registry-ubuntu-20-04-x64-cinc
        - haproxy-registry-ubuntu-22-04-x64-cinc
        # SUITES_END

# TODO: delete this
# it's a copy of https://gitlab.com/gitlab-com/gl-infra/common-ci-tasks/-/blob/main/chef-push-cookbook.yml?ref_type=heads
# with a custom refs, so that we can trigger it pre-merge
# see also: https://gitlab.com/gitlab-cookbooks/gitlab-haproxy/-/merge_requests/430
push-cookbook:
  stage: publish
  only:
    refs:
      - bump-ruby-version
    variables:
      - "$OPS_CLONE_USERNAME"
      - "$OPS_CLONE_PASSWORD"
  script:
    - rm -rf Gemfile Gemfile.lock || true
    - git clone -b "${COOKBOOK_PUBLISHER_BRANCH:-master}" https://$OPS_CLONE_USERNAME:$OPS_CLONE_PASSWORD@ops.gitlab.net/gitlab-cookbooks/cookbook-publisher.git /tmp/cookbook-publisher
    - cp /tmp/cookbook-publisher/publisher.rb /tmp/cookbook-publisher/Gemfile /tmp/cookbook-publisher/Gemfile.lock .
    - bundle install
    - bundle exec ruby publisher.rb
  needs: []
