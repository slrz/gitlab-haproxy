image: ruby:3.0

variables:
  DEBIAN_FRONTEND: "noninteractive"
  KITCHEN_YAML: "kitchen.yml"
  BUNDLE_PATH: "$CI_PROJECT_DIR/.bundle"

stages:
  - tests
  - publish

before_script:
  - eval $(ssh-agent -s)
  - ssh-add <(echo $CI_PRIVATE_KEY |base64 -d)
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - apt-get -qq update && apt-get -yqq install openssh-client rsync make jq libsodium-dev
  - make gems

cookstyle:
  stage: tests
  script:
    - bundle exec cookstyle

# The ChefSpec tests are useless now, because the kitchen.yml represents a production environment, which the tests did not cover.
# There will be InSpec tests for regression testing for the 18.04 instances to make sure they do not diverge from the expected state.
#rspec-test-job:
#  stage: tests
#  cache:
#    paths:
#      - $BUNDLE_PATH
#  script:
#    - make rspec
#  only:
#    variables:
#      - $CI_PRIVATE_KEY

.kitchen_template:
  stage: tests
  retry: 2
  artifacts:
    expire_in: '2d'
    when: always
    paths:
      - .kitchen/
    reports:
      junit: .kitchen/*_inspec.xml
  cache:
    paths:
      - $BUNDLE_PATH
  script:
    - make kitchen KITCHEN_SUITE=haproxy-$FLAVOR-$PLATFORM
  only:
    variables:
      - $CI_PRIVATE_KEY

test-kitchen:
  extends: .kitchen_template
  parallel:
    matrix:
      - FLAVOR:
          - main
          - pages
          - registry
        PLATFORM:
          - ubuntu-18
          - ubuntu-20

push-cookbook:
  stage: publish
  only:
    refs:
      - master
    variables:
      - $OPS_CLONE_USERNAME
      - $OPS_CLONE_PASSWORD
  script:
    - git clone https://$OPS_CLONE_USERNAME:$OPS_CLONE_PASSWORD@ops.gitlab.net/gitlab-cookbooks/cookbook-publisher.git /tmp/cookbook-publisher
    - cp /tmp/cookbook-publisher/publisher.rb .
    - ruby publisher.rb
