image: ruby:2.3

variables:
  DEBIAN_FRONTEND: "noninteractive"
  KITCHEN_YAML: ".kitchen.ci.yml"
  BUNDLE_PATH: "$CI_PROJECT_DIR/.bundle"
  DIGITALOCEAN_TESTBOX_FQDN: "template.${CI_PROJECT_NAMESPACE}.ci.gitlab.test"

stages:
  - unit
  - integration

before_script:
  - eval $(ssh-agent -s)
  - ssh-add <(echo $CI_PRIVATE_KEY |base64 -d)
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - apt-get -qq update && apt-get -yqq install openssh-client rsync make jq
  - make gems

rspec-test-job:
  stage: unit
  cache:
    paths:
      - $BUNDLE_PATH
  script:
    - make rspec
  only:
    variables:
      - $CI_PRIVATE_KEY

kitchen-test-job:
  stage: integration
  cache:
    paths:
      - $BUNDLE_PATH
  script:
    - make kitchen
  only:
    variables:
      - $CI_PRIVATE_KEY
