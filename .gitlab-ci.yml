image: ruby:2.6

variables:
  DEBIAN_FRONTEND: "noninteractive"
  KITCHEN_YAML: "kitchen.ci.yml"
  BUNDLE_PATH: "$CI_PROJECT_DIR/.bundle"

stages:
  - tests
  - publish

before_script:
  - eval $(ssh-agent -s)
  - ssh-add <(echo $CI_PRIVATE_KEY |base64 -d)
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - apt-get -qq update && apt-get -yqq install openssh-client rsync make jq
  - make gems

cookstyle:
  stage: tests
  script:
    - bundle exec cookstyle

rspec-test-job:
  stage: tests
  cache:
    paths:
      - $BUNDLE_PATH
  script:
    - make rspec
  only:
    variables:
      - $CI_PRIVATE_KEY

.kitchen_template:
  stage: tests
  artifacts:
    expire_in: '2d'
    when: on_failure
    paths:
      - .kitchen/
  cache:
    paths:
      - $BUNDLE_PATH
  script:
    - make kitchen KITCHEN_SUITE=$SUITE
  only:
    variables:
      - $CI_PRIVATE_KEY

kitchen-haproxy-frontend:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-frontend-ubuntu

kitchen-haproxy-frontend-cloudflare:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-frontend-cloudflare-ubuntu

kitchen-haproxy-ci:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-ci-ubuntu

kitchen-haproxy-ci-fallback:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-ci-fallback-ubuntu

kitchen-haproxy-pages:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-pages-ubuntu

kitchen-haproxy-altssh:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-altssh-ubuntu

kitchen-haproxy-registry:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-registry-ubuntu

kitchen-haproxy-camoproxy:
  extends: .kitchen_template
  variables:
    SUITE: haproxy-camoproxy-ubuntu

push-cookbook:
  stage: publish
  only:
    refs:
      - master
    variables:
      - $OPS_CLONE_USERNAME
      - $OPS_CLONE_PASSWORD
  script:
    - git clone https://$OPS_CLONE_USERNAME:$OPS_CLONE_PASSWORD@ops.gitlab.net/gitlab-cookbooks/cookbook-publisher.git /tmp/cookbook-publisher
    - cp /tmp/cookbook-publisher/publisher.rb .
    - ruby publisher.rb
